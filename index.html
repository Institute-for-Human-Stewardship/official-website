<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="The Institute for Human Stewardship is a registered 501(c)(3) nonprofit organization dedicated to saving souls through the cultivation of family and culture. IHS is headquartered in Watertown, WI.">
    <title>Institute for Human Stewardship</title>
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="css/mvp.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        div[bg] {
            background-image: url(./media/bg-768.webp);
            background-size: cover;
            background-position-x: center;
            background-position-y: top;
        }

        @media (min-width: 768px) {
            div[bg] {
                background-image: url(./media/bg.webp);
                background-position-x: right;
            }
        }
    </style>
</head>

<body>
    <time data-type="last-update" datetime="2026-09-29"></time>

    <div bg>
        <header>
            <nav>
                <img src="media/logo@64.png" alt="IHS Logo" srcset="media/logo@64.png 1x, media/logo@128.png 2x, media/logo@256.png 3x, media/logo@512.png 4x">
                <ul>
                    <li>
                        <button commandfor="login-modal" command="show-modal">Login</button>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Saving Souls<br />Through the Cultivation<br />Of Family and Culture</h2>
        </main>
    </div>

    <footer>
        <small left>&copy;2026 Institute for Human Stewardship</small>
        <small right>
            <ul>
                <li><a href="mailto:the-ihs@proton.me?subject=Confidential%20General%20Inquiry">Contact</a></li>
            </ul>
        </small>
    </footer>

    <dialog id="login-modal">
        <div data-step="1">
            <h3>Registered Email</h3>
            <input type="email" name="email" id="email" autocomplete="email">
            <div class="actions">
                <button type="button" commandfor="login-modal" command="close">Cancel</button>
                <button type="button" commandfor="login-modal" command="--continue">Continue</button>
            </div>
        </div>

        <div data-step="2" hidden>
            <h4>Thank you. If the account is recognized, an email will be sent with a link to continue.</h4>
            <button style="float:inline-end" commandfor="login-modal" command="close">Close</button>
        </div>
    </dialog>

    <script>
        modal = document.querySelector("#login-modal");
        step1 = document.querySelector("div[data-step='1']");
        step2 = document.querySelector("div[data-step='2']");
        input = document.querySelector("dialog input");

        modal.addEventListener("command", ({ command }) => {
            if (command === "close") {
                input.value = "";
                step1.hidden = false;
                step2.hidden = true;
                return;
            }

            if (command === "--continue") {
                step1.hidden = true;
                step2.hidden = false;
            }

        })
    </script>
</body>

</html>
